name: Prepare website v0.5 once
on:
  push:
    branches: [release/spec-v0.5-preparation]
    paths: [.github/workflows/prepare-v0.5-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'harness-operations/website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve the published release through the existing script
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = 3795644fa1750cfee0cbf57304c37d517741396b
          git merge-base --is-ancestor 3795644fa1750cfee0cbf57304c37d517741396b HEAD
          node scripts/prepare-release.mjs v0.5
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('SPEC_RELEASE.json', 'utf8'));
          assert.equal(release.version, 'v0.5');
          assert.equal(release.commit, '1edd5aa39e63ee860ea292a6a04fd325e521804b');
          assert.equal(release.published_at, '2026-09-30T19:30:59Z');
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.version, '0.5.0');
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(lock.version, '0.4.0');
          assert.equal(lock.packages[''].version, '0.4.0');
          const before = structuredClone(lock);
          lock.version = pkg.version;
          lock.packages[''].version = pkg.version;
          const restored = structuredClone(lock);
          restored.version = before.version;
          restored.packages[''].version = before.packages[''].version;
          assert.deepEqual(restored, before);
          writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          JS
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and validate the exact release
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile smoke and release checks
        run: npm run test:smoke
      - name: Commit verified promotion and route fixes
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v0.5-once.yml
          git add -A
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const changed = execFileSync('git', ['diff', '--cached', '--name-only', '3795644fa1750cfee0cbf57304c37d517741396b'], { encoding: 'utf8' }).trim().split('\n').sort();
          assert.deepEqual(changed, ['SPEC_RELEASE.json', 'package-lock.json', 'package.json', 'scripts/remark-spec-links.mjs', 'tests/code-mode.spec.mjs'].sort());
          JS
          git diff --cached --check
          test "$GITHUB_REF_NAME" = release/spec-v0.5-preparation
          test "$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: promote specification v0.5'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "Prepared commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
