name: Generate lockfile preview

on:
  push:
    branches:
      - v0.3/publication-hardening

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit lockfile
        run: |
          echo 'LOCKFILE_BASE64_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'LOCKFILE_BASE64_END'
